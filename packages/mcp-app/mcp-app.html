<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MCP App</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; color: #1a1a2e; background: #f8f9fa; }
      h2 { font-size: 16px; margin-bottom: 8px; color: #2d3436; }
      .section { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; border: 1px solid #e9ecef; }
      button { padding: 8px 16px; border: none; border-radius: 6px; background: #4361ee; color: #fff; font-size: 14px; cursor: pointer; transition: background 0.2s; }
      button:hover { background: #3a56d4; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .result { margin-top: 12px; padding: 12px; background: #f1f3f5; border-radius: 6px; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e9ecef; }
      th { background: #f8f9fa; font-weight: 600; color: #495057; }
      tr:last-child td { border-bottom: none; }
    </style>
  </head>
  <body>
    <div class="section">
      <h2>Hello World</h2>
      <button id="hello-btn">Call hello_world</button>
      <div id="hello-result" class="result" style="display:none"></div>
    </div>
    <div class="section">
      <h2>Addresses</h2>
      <button id="addresses-btn">Call get_addresses</button>
      <div id="addresses-result" style="display:none"></div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
